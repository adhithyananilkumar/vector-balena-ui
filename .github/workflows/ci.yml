name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  build-test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the static site
        run: npm run build
        env:
          REACT_APP_OPEN_BALENA_API_URL: https://api.example.test
          REACT_APP_OPEN_BALENA_API_VERSION: v52.2.3
          REACT_APP_VECTOR_SERVER_URL: https://vector.example.test
